defaults:
  - physicsnemo_default
  - arch:
      - fourier
      - fully_connected
  - optimizer: adam
  - scheduler: tf_exponential_lr
  - loss: sum
  - _self_

jit: false

scheduler:
  decay_rate: 0.95
  decay_steps: 8000

network_dir: "network_checkpoint"
save_filetypes: "vtk,npz,vtp"

cuda_graphs: false

optimizer:
  lr: 1.0e-4

training:
  rec_validation_freq: 1000
  rec_inference_freq: 1000
  rec_monitor_freq: 1000
  rec_constraint_freq: 1000
  max_steps: 400000

batch_size:
  inlet: 640
  outlet: 640
  top_bot: 640
  airfoil: 512
  interior_far_field: 7000
  interior_near_field: 7000
