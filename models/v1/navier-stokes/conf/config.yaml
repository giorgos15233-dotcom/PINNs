scheduler:
  decay_rate: 0.95
  decay_steps: 2000

training:
  rec_results_freq : 1000
  rec_constraint_freq: 10000
  max_steps : 200000

batch_size:
  inlet: 512
  outlet: 512
  top_bot: 512
  airfoil: 640
  interior_far_field: 7000
  interior_near_field: 7000

cuda_graphs: False
  ##run_mode: eval
jit: false
