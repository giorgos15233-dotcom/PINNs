defaults:
  - physicsnemo_default
  - optimizer: adam
  - scheduler: tf_exponential_lr
  - loss: custom-aggregator  # Εδώ καλείς πλέον τον aggregator
  - _self_

arch:
  fully_connected:
    arch_type: fully_connected
    layer_size: 512
    nr_layers: 6
    skip_connections: false
    activation_fn: silu
    adaptive_activations: false
    weight_norm: true

scheduler:
  decay_rate: 0.95
  decay_steps: 8000

optimizer:
  lr: 1e-4

training:
  rec_results_freq: 1000
  rec_constraint_freq: 10000
  max_steps: 400000

batch_size:
  inlet: 640
  outlet: 640
  top_bot: 640
  airfoil: 512
  interior_far_field: 6000
  interior_near_field: 7000

cuda_graphs: False
